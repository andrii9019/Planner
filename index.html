<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141824" media="(prefers-color-scheme: dark)">
<title>Wavelist</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --ink:#172033; --muted:#6B7488; --line:#E1E5EE;
  --accent:#0FB894; --accent-ink:#04211B; --rec:#E5484D; --warn:#D9480F;
  --shadow:0 8px 28px rgba(23,32,51,.10);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141824; --surface:#1E2433; --ink:#EEF1F8; --muted:#98A1B6; --line:#2C3346;
    --accent:#2EE6BE; --shadow:0 8px 28px rgba(0,0,0,.35); }
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column;overflow:hidden;overflow:clip}
header{display:flex;align-items:flex-end;justify-content:space-between;padding:18px 20px 6px}
header h1{font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:0}
header .sub{color:var(--muted);font-size:14px;font-weight:500;margin-top:4px}
.icon-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow)}
.icon-btn svg{width:22px;height:22px}

.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 20px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;
  background:var(--surface);font-weight:600;font-size:15px;white-space:nowrap;border:1.5px solid transparent}
.tab .dot,.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.tab.on{background:var(--ink);color:var(--bg)}
.tab .cnt{font-size:12px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:grid;place-items:center;
  background:var(--bg);color:var(--ink)}
.tab.ghost{background:transparent;border-color:var(--line);color:var(--muted)}

main{flex:1;overflow-y:auto;padding:4px 16px 150px}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:20px;padding:14px 14px 14px 12px;margin:8px 0}
.item.tinted{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 16%,transparent),color-mix(in srgb,var(--c) 3%,transparent) 70%),var(--surface);box-shadow:inset 4px 0 0 var(--c)}
.item.tinted .chk{border-color:var(--c)}
.item.tinted.done{opacity:.75}
.chk{flex:none;width:28px;height:28px;padding:0;border-radius:999px;border:2px solid var(--line);display:grid;place-items:center;margin-top:-1px}
.chk svg{width:16px;height:16px;opacity:0}
.item.done .chk{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#fff}
.item.done .chk svg{opacity:1}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.body{flex:1;min-width:0;text-align:left;padding:0}
.t{font-weight:600;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--bg);color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.pill.late{color:#fff;background:var(--rec)}
.item.overdue{box-shadow:0 0 0 1.5px rgba(229,72,77,.7),0 0 18px rgba(229,72,77,.28);background:linear-gradient(90deg,rgba(229,72,77,.12),rgba(229,72,77,.03)),var(--surface)}
.item.overdue .chk{border-color:rgba(229,72,77,.7)}
.tab .cnt.late{background:var(--rec);color:#fff}
.pill.today{color:var(--accent)}
.pill svg{width:13px;height:13px}
.empty{text-align:center;color:var(--muted);padding:56px 24px;max-width:34ch;margin:0 auto}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
details.donebox{margin-top:18px}
details.donebox summary{list-style:none;color:var(--muted);font-weight:600;padding:8px 6px;cursor:pointer}
details.donebox summary::-webkit-details-marker{display:none}

.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--bg) 70%,transparent)}
.dock-in{max-width:608px;margin:0 auto;display:flex;gap:10px}
.mic{flex:1;height:64px;border-radius:999px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;gap:12px;
  font-size:18px;font-weight:700;box-shadow:0 10px 30px rgba(15,184,148,.35)}
.mic svg{width:26px;height:26px}
.mic:active{transform:scale(.98)}
.type{width:64px;height:64px;border-radius:999px;background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow)}
.type svg{width:24px;height:24px}

/* voice overlay */
.voice{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;z-index:30;text-align:center}
.voice.show{display:flex}
.ring{width:132px;height:132px;border-radius:50%;background:var(--rec);display:grid;place-items:center;color:#fff;position:relative}
.ring svg{width:48px;height:48px}
.ring::before,.ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--rec);animation:pulse 1.6s ease-out infinite}
.ring::after{animation-delay:.8s}
@keyframes pulse{from{transform:scale(1);opacity:.6}to{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion: reduce){.ring::before,.ring::after{animation:none;opacity:0}}
.vtext{font-size:24px;font-weight:700;line-height:1.3;margin:40px 0 12px;min-height:3.9em;max-width:22ch;overflow-wrap:anywhere}
.vhint{color:var(--muted);font-size:14px;max-width:32ch}
.vacts{display:flex;gap:10px;margin-top:36px;width:100%;max-width:360px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,24,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.panel{max-width:640px;margin:0 auto;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));
  max-height:88vh;overflow-y:auto}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh-h h2{margin:0;font-size:20px;font-weight:800}
.x{width:36px;height:36px;border-radius:999px;background:var(--bg);font-size:15px}
textarea,input[type=text],input[type=date],input[type=time],select{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:18px;padding:12px 14px;font-size:16px}
textarea{resize:none;font-weight:600;font-size:18px}
.lbl{font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:999px;background:var(--bg);font-weight:600;font-size:14px;border:1.5px solid transparent}
.chip.on{border-color:var(--c);background:var(--surface)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.fld span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.tgl{display:flex;align-items:center;gap:12px;margin-top:16px;font-weight:600;cursor:pointer}
.tgl input{width:22px;height:22px;accent-color:var(--accent)}
.acts{display:flex;gap:10px;margin-top:22px}
.btn{height:52px;padding:0 20px;border-radius:999px;font-weight:700;background:var(--bg);flex:1}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--rec);flex:0 0 auto}
.btn.small{height:40px;flex:0 0 auto;padding:0 16px;font-size:14px}
.link{color:var(--accent);font-weight:700;padding:8px 0}
.note{font-size:13.5px;color:var(--muted);margin-top:8px}
.note ol{padding-left:20px;margin:6px 0}
.brow{display:flex;align-items:center;gap:8px;margin:8px 0}
.brow input{flex:1;padding:10px 14px}
.swatch{width:38px;height:38px;border-radius:999px;flex:none;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.del{width:38px;height:38px;border-radius:999px;flex:none;background:var(--bg);color:var(--rec);display:grid;place-items:center}
.del svg{width:18px;height:18px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--bg)}
.status.ok{color:#12A594}
hr{border:0;border-top:1px solid var(--line);margin:20px 0}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;font-size:14.5px;display:flex;gap:14px;align-items:center;
  transition:all .2s;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--accent);font-weight:800;filter:brightness(1.4)}
.item,.tab,.grp-h{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.item{transition:transform .15s}
.item.lp{transform:scale(.97)}
.tab.drag{position:relative;z-index:2;box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.tab.plus{width:40px;padding:0;justify-content:center;font-size:22px;font-weight:600}
.grp{margin:4px 0 20px}
.grp-h{display:flex;align-items:center;gap:9px;width:100%;text-align:left;font-weight:800;font-size:17px;padding:8px 6px 2px}
.grp-h .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.grp-h .n{color:var(--muted);font-size:14px;font-weight:700}
.grp-empty{color:var(--muted);font-size:14px;padding:6px 6px 0}
.mv-t{font-weight:700;font-size:17px;margin-bottom:14px;overflow-wrap:anywhere}
.chips.big .chip{height:48px;padding:0 18px;font-size:16px}
.mvb{width:34px;height:38px;border-radius:999px;background:var(--bg);flex:none;font-weight:800}
.mvb:disabled{opacity:.3}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:6px}
.sw{aspect-ratio:1;border-radius:50%;background:var(--c);position:relative;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.sw.custom{background:conic-gradient(#E5484D,#F5A524,#FFD60A,#30A46C,#0091FF,#8E4EC6,#E5484D);display:grid;place-items:center;overflow:hidden}
.sw.custom.on{background:var(--c)}
.sw.custom::after{content:"+";color:#fff;font-weight:800;font-size:18px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
#list{touch-action:pan-y;will-change:transform}
.done-acts{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 6px 4px;font-size:13px;color:var(--muted)}
.clear-done{color:var(--rec);font-weight:700;font-size:14px;padding:8px 0}
.all-clear{display:block;margin:4px auto 0;padding:10px 18px;border-radius:999px;background:var(--surface);color:var(--rec);font-weight:700;font-size:14px}
.item.swiping{transition:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1 id="title">Wavelist</h1><div class="sub" id="today"></div></div>
    <button class="icon-btn" id="btn-settings" data-i18n-aria="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <nav class="tabs" id="tabs" data-i18n-aria="boards" aria-label="Boards"></nav>
  <main id="list"></main>
</div>

<div class="dock"><div class="dock-in">
  <button class="type" id="btn-type" data-i18n-aria="add_typing" aria-label="Add by typing">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button class="mic" id="btn-mic">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
    <span data-i18n="dictate">Dictate</span>
  </button>
</div></div>

<div class="voice" id="voice" role="dialog" data-i18n-aria="voice_input" aria-label="Voice input">
  <div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg></div>
  <div class="vtext" id="vtext" data-i18n="listening">Listening…</div>
  <div class="vhint" data-i18n="vhint">Speak in Ukrainian, e.g. «Купити молоко і хліб» or «Зустріч з Олегом завтра о 15:00»</div>
  <div class="vacts"><button class="btn" id="v-cancel" data-i18n="cancel">Cancel</button><button class="btn primary" id="v-done" data-i18n="done">Done</button></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="panel"><div class="grab"></div><div id="sheet-c"></div></div></div>
<div class="toast" id="toast"><span id="toast-t"></span><button id="toast-a"></button></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const ICON_CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';

/* ---------- state ---------- */
const COLORS = [
  '#E5484D','#FF6B6B','#F76B8A','#E93D82','#D6409F','#AB4ABA',
  '#8E4EC6','#6E56CF','#5B5BD6','#3D5AFE','#0091FF','#0EA5E9',
  '#05A2C2','#12A594','#0FB894','#2EE6BE','#30A46C','#46A758',
  '#84CC16','#BDEE63','#FFD60A','#F5A524','#F76808','#E54D2E',
  '#AD7F58','#978365','#8D8D86','#6B7488','#475569','#1F2937',
  '#FDA4AF','#C4B5FD','#93C5FD','#99F6E4','#FDE68A','#FDBA74'
];
const nextColor = () => COLORS.find(c => !S.boards.some(b => b.color.toLowerCase() === c.toLowerCase())) || COLORS[S.boards.length % COLORS.length];
function paletteHTML(sel) {
  const s = (sel || '').toLowerCase(); const custom = s && !COLORS.some(c => c.toLowerCase() === s);
  return `<div class="pal">${COLORS.map(c => `<button class="sw${c.toLowerCase() === s ? ' on' : ''}" data-c="${c}" style="--c:${c}" aria-label="${t('color_n', { c })}"></button>`).join('')}
    <label class="sw custom${custom ? ' on' : ''}" style="--c:${custom ? sel : 'transparent'}" aria-label="${t('custom_color')}"><input type="color" value="${custom ? sel : '#0FB894'}"></label></div>`;
}
function bindPalette(root, onPick) {
  const pal = root.querySelector('.pal');
  const mark = el => pal.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === el));
  pal.querySelectorAll('button.sw').forEach(b => b.onclick = () => { mark(b); onPick(b.dataset.c); });
  const cu = pal.querySelector('.custom'), inp = cu.querySelector('input');
  inp.oninput = () => { cu.style.setProperty('--c', inp.value); mark(cu); onPick(inp.value); };
}
const DEF_BOARDS = [
  { id: 'todo', name: null, color: '#0FB894' },
  { id: 'progress', name: null, color: '#F5A524' },
  { id: 'events', name: null, color: '#E5484D' },
  { id: 'buy', name: null, color: '#3D5AFE' }
];
const KEY = 'planner.v1';
let S = load(); save();
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.boards)) return migrate4(migrate3(migrate(s))); } catch (e) {}
  return { v: 4, boards: DEF_BOARDS.map(b => ({ ...b })), items: [], active: 'all',
    settings: { clientId: '', gConnected: false, autoSave: false, duration: 60, lang: 'auto' } };
}
function migrate(s) {
  if (s.v >= 2) return s;
  const t = s.boards.find(b => b.id === 'todo'); if (t && t.name === 'Зробити') t.name = 'Завдання';
  const st = s.boards.find(b => b.id === 'strategic');
  if (st && !s.items.some(i => i.boardId === 'strategic')) s.boards = s.boards.filter(b => b !== st);
  const order = ['todo', 'progress', 'events', 'buy'];
  s.boards = [...order.map(id => s.boards.find(b => b.id === id)).filter(Boolean), ...s.boards.filter(b => !order.includes(b.id))];
  const buy = s.boards.find(b => b.id === 'buy'); if (buy && buy.color === '#12A594') buy.color = '#3D5AFE';
  s.active = 'all'; s.v = 2; return s;
}
function migrate3(s) {
  if (s.v >= 3) return s;
  const EN = { todo: ['Завдання', 'Tasks'], progress: ['В процесі', 'In progress'], events: ['Події', 'Events'], buy: ['Купити', 'Shopping'] };
  s.boards.forEach(b => { const e = EN[b.id]; if (e && b.name === e[0]) b.name = e[1]; });
  s.v = 3; return s;
}
function migrate4(s) {
  if (s.v >= 4) return s;
  const known = { todo: ['Tasks','Завдання','Tareas','Зробити'], progress: ['In progress','В процесі','En curso'], events: ['Events','Події','Eventos'], buy: ['Shopping','Купити','Compras'] };
  s.boards.forEach(b => { if (known[b.id] && known[b.id].includes(b.name)) b.name = null; });
  s.settings = s.settings || {}; if (!s.settings.lang) s.settings.lang = 'auto';
  s.v = 4; return s;
}
const curBoard = () => (S.active !== 'all' && board(S.active)) ? S.active : (S.boards[0] ? S.boards[0].id : null);
var schedT; function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} clearTimeout(schedT); schedT = setTimeout(() => { if (typeof scheduleNotifs === 'function') scheduleNotifs(); }, 300); }
const board = id => S.boards.find(b => b.id === id);

/* swipe between boards: content follows the finger, then snaps */
(() => {
  const m = $('#list');
  let sx = 0, sy = 0, dx = 0, mode = null, on = false, busy = false, px = 0, pt = 0, vel = 0, tgt = null;
  const set = (x, t) => { m.style.transition = t || 'none'; m.style.transform = x ? `translateX(${x}px)` : 'translateX(0)';
    m.style.opacity = String(1 - Math.min(Math.abs(x) / m.clientWidth, 1) * 0.5); };
  const back = () => set(0, `transform 220ms ${EASE}, opacity 220ms ${EASE}`);
  m.addEventListener('touchstart', e => {
    on = e.touches.length === 1 && !busy; if (!on) return;
    sx = px = e.touches[0].clientX; sy = e.touches[0].clientY; pt = performance.now(); dx = 0; vel = 0; mode = null;
    tgt = e.target.closest('.item.done');
  }, { passive: true });
  m.addEventListener('touchmove', e => {
    if (!on) return; const x = e.touches[0].clientX, y = e.touches[0].clientY;
    if (!mode) {
      if (Math.abs(x - sx) > 10 && Math.abs(x - sx) > Math.abs(y - sy) * 1.2) { mode = 'h'; sx = x; px = x; }
      else if (Math.abs(y - sy) > 10) { mode = 'v'; on = false; }
      return;
    }
    if (lpFired) { on = false; back(); return; }
    const now = performance.now(); if (now > pt) vel = 0.7 * ((x - px) / (now - pt)) + 0.3 * vel; px = x; pt = now;
    dx = x - sx;
    if (tgt) { tgt.classList.add('swiping'); tgt.style.transform = `translateX(${dx}px)`;
      tgt.style.opacity = String(1 - Math.min(Math.abs(dx) / tgt.offsetWidth, 1) * 0.7); return; }
    const vs = views(), i = vs.indexOf(S.active);
    if ((dx > 0 && i === 0) || (dx < 0 && i === vs.length - 1)) dx *= 0.25;
    set(dx);
  }, { passive: true });
  const end = () => {
    if (!on || mode !== 'h') { on = false; return; } on = false;
    if (tgt) { swipeItemEnd(tgt, dx, vel); tgt = null; return; }
    const vs = views(), dir = dx < 0 ? 1 : -1, j = vs.indexOf(S.active) + dir, w = m.clientWidth;
    const fling = Math.abs(vel) > 0.35 && Math.sign(vel) === -dir && Math.abs(dx) > 24;
    if (j < 0 || j >= vs.length || !(Math.abs(dx) > w * 0.28 || fling)) { back(); return; }
    busy = true;
    const dur = Math.max(90, Math.min(170, (w - Math.abs(dx)) / Math.max(Math.abs(vel), 1.2)));
    set(-dir * w, `transform ${dur}ms cubic-bezier(.3,.6,.4,1), opacity ${dur}ms linear`);
    setTimeout(() => { go(vs[j], dir); busy = false; }, dur);
  };
  m.addEventListener('touchend', end);
  m.addEventListener('touchcancel', () => { if (on && mode === 'h') { if (tgt) swipeItemEnd(tgt, 0, 0); else back(); } on = false; tgt = null; });
  function swipeItemEnd(el, dx, vel) {
    const w = el.offsetWidth, fling = Math.abs(vel) > 0.4 && Math.sign(vel) === Math.sign(dx) && Math.abs(dx) > 30;
    el.classList.remove('swiping');
    if (!(Math.abs(dx) > w * 0.35 || fling)) {
      el.style.transition = `transform 220ms ${EASE}, opacity 220ms ${EASE}`; el.style.transform = ''; el.style.opacity = ''; return;
    }
    const it = S.items.find(i => i.id === el.dataset.id);
    el.style.transition = 'transform 150ms ease-out, opacity 150ms linear';
    el.style.transform = `translateX(${Math.sign(dx) * w}px)`; el.style.opacity = '0';
    setTimeout(() => {
      el.style.height = el.offsetHeight + 'px'; el.getBoundingClientRect();
      el.style.transition = 'height 160ms ease-out, margin 160ms ease-out, padding 160ms ease-out';
      el.style.height = '0'; el.style.margin = '0'; el.style.paddingTop = el.style.paddingBottom = '0'; el.style.overflow = 'hidden';
      setTimeout(() => { if (it) removeItems([it], t('deleted')); }, 160);
    }, 150);
  }
})();

const REPS = ['daily', 'weekdays', 'weekly', 'monthly'];
const RRULE = { daily: 'FREQ=DAILY', weekdays: 'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR', weekly: 'FREQ=WEEKLY', monthly: 'FREQ=MONTHLY' };
function stepDate(ds, r) {
  const d = new Date(ds + 'T00:00');
  if (r === 'monthly') { const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + 1);
    d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); }
  else { d.setDate(d.getDate() + (r === 'weekly' ? 7 : 1)); if (r === 'weekdays') while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1); }
  return ymd(d);
}
function firstFrom(ds, r, includeSelf) {
  const today = ymd(new Date()); let x = includeSelf ? ds : stepDate(ds, r);
  if (r === 'weekdays' && includeSelf) { const d = new Date(x + 'T00:00'); if (d.getDay() === 0 || d.getDay() === 6) x = stepDate(x, r); }
  let g = 0; while (x < today && g++ < 4000) x = stepDate(x, r); return x;
}
function rollRepeats() {
  let ch = false; const today = ymd(new Date());
  S.items.forEach(i => { if (i.repeat && !i.done && i.date && i.date < today) { i.date = firstFrom(i.date, i.repeat, false); i.notified = null; ch = true; } });
  if (ch) save(); return ch;
}
function isOverdue(i) {
  if (i.done || !i.date) return false;
  const n = dayDiff(i.date); if (n < 0) return true; if (n > 0 || !i.time) return false;
  const d = new Date(); return i.time < pad(d.getHours()) + ':' + pad(d.getMinutes());
}

  if (i.date) {
    const n = dayDiff(i.date); const cls = isOverdue(i) ? ' late' : (n === 0 ? ' today' : '');
    meta += `<span class="pill${cls}">${dateLabel(i.date)}${i.time ? ', ' + i.time : ''}</span>`;
  }
  if (i.repeat) meta += `<span class="pill">↻ ${t('rep_' + i.repeat)}</span>`;
  if (i.gid) meta += `<span class="pill" title="${t('in_cal')}">${ICON_CAL}${t('calendar')}</span>`;
  const bc = (board(i.boardId) || {}).color;
  return `<div class="item${bc ? ' tinted' : ''}${i.done ? ' done' : ''}${isOverdue(i) ? ' overdue' : ''}" data-id="${i.id}"${bc ? ` style="--c:${bc}"` : ''}>

}

const SNAP_KEY = 'planner.snaps';
const fmtStamp = ts => new Date(ts).toLocaleString(LOCALES[LANG], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const dataOf = () => ({ app: 'wavelist', v: 1, savedAt: new Date().toISOString(), boards: S.boards, items: S.items });
function getSnaps() { try { return JSON.parse(localStorage.getItem(SNAP_KEY)) || []; } catch (e) { return []; } }
function putSnaps(a) { try { localStorage.setItem(SNAP_KEY, JSON.stringify(a)); } catch (e) { if (a.length > 2) putSnaps(a.slice(0, a.length - 1)); } }
function takeSnap(force) {
  if (!S.items.length && !force) return;
  const a = getSnaps(), body = JSON.stringify({ boards: S.boards, items: S.items });
  if (!force && a[0] && (ymd(new Date(a[0].t)) === ymd(new Date()) || JSON.stringify(a[0].data) === body)) return;
  a.unshift({ t: Date.now(), data: JSON.parse(body) }); putSnaps(a.slice(0, 7));
}
function snapList() {
  const a = getSnaps(); if (!a.length) return `<div class="note" style="margin-top:0">${t('no_snaps')}</div>`;
  return `<div class="chips">${a.map((s, k) => `<button class="chip" data-snap="${k}">${fmtStamp(s.t)} · ${t('snap_tasks', { n: s.data.items.length })}</button>`).join('')}</div>`;
}
function restoreData(j) {
  takeSnap(true);
  S.boards = j.boards; S.items = j.items; if (!board(S.active)) S.active = 'all'; save(); render();
}
async function saveBackup() {
  const name = 'wavelist-backup-' + ymd(new Date()) + '.json';
  const blob = new Blob([JSON.stringify(dataOf(), null, 2)], { type: 'application/json' });
  const done = () => { S.settings.backupAt = Date.now(); save(); toast(t('backup_saved')); return true; };
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return done(); }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  return done();
}
let backupNagged = false;
function backupNag() {
  const st = S.settings; if (backupNagged || st.backupRemind === false || S.items.length < 3) return;
  const since = Date.now() - (st.backupAt || st.firstUse || 0);
  if (!st.backupAt && !st.firstUse) { st.firstUse = Date.now(); save(); return; }
  if (since > 7 * 864e5) { backupNagged = true; setTimeout(() => toast(t('backup_due'), t('backup_now'), saveBackup), 1500); }
}

/* ---------- Google Calendar ---------- */
let token = null, tokenExp = 0;
try { const t = JSON.parse(sessionStorage.getItem('planner.tok')); if (t && t.exp > Date.now()) { token = t.v; tokenExp = t.exp; } } catch (e) {}
const calReady = () => !!(S.settings.clientId && S.settings.gConnected);
function gisLoad() {
  return new Promise((res, rej) => {
    if (window.google && google.accounts && google.accounts.oauth2) return res();
    const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client';
    s.onload = res; s.onerror = () => rej(new Error(t('no_google'))); document.head.appendChild(s);
  });
}
async function getToken(interactive) {
  if (token && Date.now() < tokenExp - 60000) return token;
  await gisLoad();
  return new Promise((res, rej) => {
    const c = google.accounts.oauth2.initTokenClient({
      client_id: S.settings.clientId, scope: 'https://www.googleapis.com/auth/calendar.events',
      callback: r => {
        if (r.error) return rej(new Error(r.error));
        token = r.access_token; tokenExp = Date.now() + r.expires_in * 1000;
        try { sessionStorage.setItem('planner.tok', JSON.stringify({ v: token, exp: tokenExp })); } catch (e) {}
        S.settings.gConnected = true; save(); res(token);
      },
      error_callback: e => rej(new Error(e.type === 'popup_closed' ? t('win_closed') : (e.type || t('error'))))
    });
    c.requestAccessToken({ prompt: interactive ? 'consent' : '' });
  });
}
function evBody(it) {
  const b = evBody0(it); if (it.repeat) b.recurrence = ['RRULE:' + RRULE[it.repeat]]; return b;
}
function evBody0(it) {
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  if (it.time) {
    const st = new Date(it.date + 'T' + it.time); const en = new Date(st.getTime() + (S.settings.duration || 60) * 60000);
    const f = d => ymd(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':00';
    return { summary: it.title, start: { dateTime: f(st), timeZone: tz }, end: { dateTime: f(en), timeZone: tz },
      reminders: { useDefault: false, overrides: [{ method: 'popup', minutes: +S.settings.remind || 0 }] } };
  }
  const n = new Date(it.date + 'T00:00'); n.setDate(n.getDate() + 1);
  return { summary: it.title, start: { date: it.date }, end: { date: ymd(n) } };
}
const API = 'https://www.googleapis.com/calendar/v3/calendars/primary/events';
async function syncItem(it) {
  if (!calReady()) return;
  try {
    const tk = await getToken(false);
    if (it.cal && it.date) {
      const r = await fetch(API + (it.gid ? '/' + it.gid : ''), { method: it.gid ? 'PATCH' : 'POST',
        headers: { Authorization: 'Bearer ' + tk, 'Content-Type': 'application/json' }, body: JSON.stringify(evBody(it)) });
      if ((r.status === 404 || r.status === 410) && it.gid) { it.gid = null; return syncItem(it); }
      if (r.status === 401) { token = null; throw new Error('auth'); }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      it.gid = (await r.json()).id;
    } else if (it.gid) { await calDelete(it); }
    save(); render();
  } catch (e) { toast(t('sync_failed'), t('retry'), () => syncItem(it)); }
}
async function calDelete(it) {
  if (!it.gid || !calReady()) return;
  try { const tk = await getToken(false); await fetch(API + '/' + it.gid, { method: 'DELETE', headers: { Authorization: 'Bearer ' + tk } }); it.gid = null; save(); }
  catch (e) {}
}
function templateUrl(it) {
  const c = s => s.replace(/[-:]/g, '');
  let dates;
  if (it.time) {
    const st = new Date(it.date + 'T' + it.time); const en = new Date(st.getTime() + (S.settings.duration || 60) * 60000);
    const f = d => ymd(d) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00';
    dates = c(f(st)) + '/' + c(f(en));
  } else { const n = new Date(it.date + 'T00:00'); n.setDate(n.getDate() + 1); dates = c(it.date) + '/' + c(ymd(n)); }
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(it.title) + '&dates=' + dates + (it.repeat ? '&recur=' + encodeURIComponent('RRULE:' + RRULE[it.repeat]) : '');
}

/* ---------- voice ---------- */
let rec = null, finalTxt = '', interimTxt = '', cancelled = false;
function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast(t('voice_chrome')); openEdit(null); return; }
  if (rec) return;
  finalTxt = ''; interimTxt = ''; cancelled = false;
  $('#vtext').textContent = t('listening'); $('#voice').classList.add('show');
  rec = new SR(); rec.lang = 'uk-UA'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  rec.onresult = e => {
    interimTxt = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i]; if (r.isFinal) finalTxt += r[0].transcript; else interimTxt += r[0].transcript;
    }
    $('#vtext').textContent = (finalTxt + interimTxt) || t('listening');
  };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast(t('mic_allow'));
    else if (e.error === 'no-speech') toast(t('no_speech'));
    else if (e.error === 'network') toast(t('need_net'));
  };
  rec.onend = () => {
    $('#voice').classList.remove('show'); rec = null;
    const text = (finalTxt || interimTxt).trim();
    if (cancelled || !text) return;
    const p = parse(text);
    if (S.settings.autoSave) {
      const it = { id: uid(), created: Date.now(), done: false, ...p, cal: !!(p.date && (p.time || p.boardId === 'events')) };
      S.items.push(it); if (S.active !== 'all') S.active = it.boardId; save(); render(); afterSave(it, false);
      toast(t('added_to', { b: bn(board(it.boardId)) }), t('edit_item'), () => openEdit(it));
    } else openEdit(null, p);
  };
  try { rec.start(); } catch (e) { rec = null; $('#voice').classList.remove('show'); }
}
$('#btn-mic').onclick = startVoice;
$('#v-done').onclick = () => rec && rec.stop();
$('#v-cancel').onclick = () => { cancelled = true; rec ? rec.abort() : $('#voice').classList.remove('show'); };
$('#btn-type').onclick = () => openEdit(null);
$('#btn-settings').onclick = openSettings;

/* ---------- reminders & overdue refresh ---------- */
const notifPerm = () => ('Notification' in window) ? Notification.permission : 'denied';
let nTimers = [];
function fireAt(i) {
  if (!i.date) return null;
  const at = new Date(i.date + 'T' + (i.time || '09:00'));
  return at.getTime() - (i.time ? (+S.settings.remind || 0) * 60000 : 0);
}
async function notify(i) {
  const body = dateLabel(i.date) + (i.time ? ', ' + i.time : '') + ' · ' + bn(board(i.boardId));
  const opts = { body, tag: i.id, icon: 'icon-192.png', badge: 'icon-192.png', data: { url: location.href.split('?')[0] } };
  try { const r = await navigator.serviceWorker.ready; await r.showNotification(i.title, opts); }
  catch (e) { try { new Notification(i.title, opts); } catch (_) {} }
}
function scheduleNotifs() {
  nTimers.forEach(clearTimeout); nTimers = [];
  if (!S.settings.notify || notifPerm() !== 'granted') return;
  const now = Date.now();
  S.items.forEach(i => {
    const at = fireAt(i); if (i.done || at == null || i.notified === at) return;
    if (at <= now) { if (now - at < 6 * 3600e3) { i.notified = at; save(); notify(i); } return; }
    if (at - now < 2 ** 31 - 1) nTimers.push(setTimeout(() => { if (!i.done && S.items.includes(i)) { i.notified = at; save(); notify(i); } }, at - now));
  });
}
let lateSig = '';
function overdueTick(force) {
  if (rollRepeats()) force = true;
  const sig = S.items.filter(isOverdue).map(i => i.id).join(',');
  if ((force || sig !== lateSig) && !document.querySelector('.tab.drag') && !$('#voice').classList.contains('show')) { lateSig = sig; render(); }
}
setInterval(overdueTick, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { overdueTick(true); scheduleNotifs(); } });

/* ---------- boot ---------- */
LANG = pickLang(); applyStatic();
rollRepeats(); render(); lateSig = S.items.filter(isOverdue).map(i => i.id).join(','); scheduleNotifs(); takeSnap(); backupNag();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
if (new URLSearchParams(location.search).get('voice') === '1') {
  history.replaceState(null, '', location.pathname);
  setTimeout(startVoice, 350);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); takeSnap(); } });
</script>
